# M6 feature manifest — Batch D audit
# Generated by the Batch D column audit (instruction_m6.md §2).
# Maps every column of the fitted M6 design matrix to its docs/M6.md §1 planned variable.

model_label: M6-core (A/B/C)
source_commit: ff6287d0e336ab4e3a3d178593d3bb28e3f33a21
country: sri_lanka
design_matrix:
  n_features: 92
  estimator: LogisticRegression(penalty=l2, C=0.001, solver=lbfgs)
  feature_selection: none  # L2 only; 0 of 92 coefficients are zero
  coefficients_sha256_16: 2fac7f7ce998d32c
  features_table_sha256_16: 69033629d021dc39
  rowset_sha256_16: 64f6a58d3466161f

batches_present:
  A: {n_features: 20, planned_vars: [1, 2, 3, 4]}
  B: {n_features: 14, planned_vars: [5, 6, 7, 8, 11, 12]}
  C: {n_features: 54, planned_vars: [9, 10]}

batch_D_status: ABSENT_AS_DESIGNED
batch_D_detail:
  13_mobility_connectivity: absent    # no gravity in-flow / centrality features built
  14_socioeconomic_wealth: absent     # no Meta RWI, no nightlights+built SES proxy
  15_healthcare_access: absent        # no travel-time or distance-to-facility surface
  16_rice_paddy_cropland: partial     # see below
  16_partial_note: >-
    frac_crops is present, but it is one of seven Impact Observatory io-lulc-annual-v02
    class fractions co-extracted wholesale by notebook 03 (Batch B), not a deliberate
    Batch D build. Two departures from M6.md 6.16: the product is Impact Observatory,
    not ESA WorldCover; and the EVI phenology amplitude (seasonal max-min paddy-intensity
    proxy) that 6.16 pairs with the cropland share was never built. The static share is
    therefore present incidentally and the seasonal half is absent.

planned_variables_fully_absent: [13, 14, 15]

product_departures_from_M6_md:
  land_cover_product: >-
    M6.md 1 names ESA WorldCover / GHSL for the land-cover-derived variables (5, 8, 12, 16).
    The executed build used Impact Observatory io-lulc-annual-v02 (10 m) throughout
    (notebook 03). frac_water therefore measures planned variable 11 via the LULC class
    vector rather than the JRC Global Surface Water layer that 6.11 specifies; the JRC
    layer is also present, as water_occurrence_mean / permanent_water_frac.
  uhi_variant: >-
    6.9's optional UHI variant (unit LST minus rural-ring LST) was not built. Only the
    direct LST statistics are present. 6.9 marks it optional, so this is not a departure
    from a requirement.

unplanned_features:
  # Co-extracted LULC classes not enumerated among the 16.
  - frac_bare
  - frac_flooded_veg
  - frac_rangeland

