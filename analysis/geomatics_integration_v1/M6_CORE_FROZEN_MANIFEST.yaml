provenance_gaps:
  threshold_generator_not_committed:
    severity: blocking_for_reproducibility
    status: BLOCKED  # port attempted 2026-08-07; only half recovers
    detail: >-
      m6_label_thresholds_srilanka_v1.csv defines the model target, but no committed
      code produces it. Notebook 06 only consumes it via THRESHOLDS_CSV; notebook 05
      stopped before constructing a label. The WorldPop year-ratio recovery was run as
      ad-hoc session code and was never written to scripts/ or a notebook. This trips
      instruction_m6.md §25's stop condition on establishing which artifact produced a
      manuscript number, for the target itself.
    port_attempt: scripts/m6_threshold_recovery_v1.py
    recovered: >-
      The feasible-interval solver and the clamp rule reproduce EXACTLY: 26/26 districts
      admit a non-empty interval, all 26 frozen K values lie inside their own interval,
      and all 5 clamped districts sit on the lower bound to within 1e-12.
    not_recovered: >-
      The empirical q75 half does not reproduce: best 10 of 21 districts across
      {2 year bases} x {6 train row-sets} x {5 interpolation modes}. K is an exact
      observed train ratio in 21/21 districts at quantile level 0.733-0.765, so the
      method is confirmed, but K sits at a VARYING rank (187-195 of 255) where a fixed
      quantile rule would give a fixed rank -- the original train row set differed from
      any recoverable here by a few rows. Search halted per §25 rather than continuing
      until a definition matched.
    consequence: >-
      The 19.2% of test rows that are test-informed ARE reproducible; the 80.8% that are
      train-only are NOT. Route A (the original threshold artifact) is now the only
      clean resolution.
  nb05_provenance_stale:
    severity: documentation
    detail: >-
      nb05_provenance.json still records status 'STOPPED at M6.md §11 — thresholds not
      reproducible; label NOT constructed', which predates the recovery. Its rowset
      output hash is still correct and is what notebook 06 consumed.

